<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在庫登録 | バラ注文アプリ</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app-layout">


<aside class="sidebar">
  <div class="logo-area">
    <p class="logo-sub">Rose Order App</p>
    <h1>バラ注文アプリ</h1>
  </div>

  <nav class="side-nav">
    <a href="/admin">在庫一覧</a>
    <a href="/add-flower">品種登録</a>
    <a href="/stock">在庫登録</a>
    <a href="/order">注文登録</a>
    <a href="/waste">廃棄登録</a>

    <div class="nav-divider"></div>

    <a href="/welcome" class="back-home">← ウェルカムへ戻る</a>
  </nav>
</aside>

  <main class="main-content">

    <header class="page-header">
      <div>
        <p class="page-label">Stock Registration</p>
        <h2>在庫を追加</h2>
      </div>
    </header>

    <section class="content-card">
      <p th:if="${param.success}" class="success-message">
  在庫を登録しました。
</p>

<form class="stock-form" action="/stock/add" method="post">

  <div class="form-group">
    <label>品種名</label>
    <select name="variety" required>
  <option value="">品種を選択してください</option>
  <option th:each="rose : ${roses}"
          th:value="${rose.variety}"
          th:text="${rose.variety}">
    品種名
  </option>
</select>
  </div>

  <div class="form-group">
    <label>追加本数</label>
    <input type="number" name="quantity" placeholder="10" min="1" required>
  </div>

  <div class="form-group">
    <label>入荷日</label>
    <input type="date" name="arrivalDate">
  </div>

  <button type="submit" class="primary-btn">
    在庫を登録
  </button>

</form>

    </section>

  </main>

</div>

</body>
</html>
