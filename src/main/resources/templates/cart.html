<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カート | バラ注文アプリ</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">

<aside class="sidebar">
  <div class="logo-area">
    <p class="logo-sub">Rose Order App</p>
    <h1>バラ注文アプリ</h1>
  </div>

  <nav class="side-nav">
    <a href="/admin">在庫一覧</a>
      <a href="/add-flower">品種登録</a>
      <a href="/stock">在庫登録</a>
      <a href="/order">注文登録</a>
      <a href="/waste">廃棄登録</a>
      <a href="/history">注文履歴</a>
      <a href="/analytics" class="active">売上分析</a>

    <div class="nav-divider"></div>

    <a href="/welcome" class="back-home">
      ← ウェルカムへ戻る
    </a>
  </nav>
</aside>


    <main class="main-content">
      <header class="page-header">
        <div>
          <p class="page-label">Cart</p>
          <h2>カート内容</h2>
        </div>
      </header>

      <div class="cart-page-layout">
        <section class="content-card">
          <div class="section-head single">
            <div>
              <h3>選択した商品</h3>
              <p>本数を変更できます</p>
            </div>
          </div>

          <div class="cart-items large-cart-items">

  <div th:if="${#lists.isEmpty(cart)}">
    <p class="empty-cart">
      まだ商品が入っていません
    </p>
  </div>

  <div class="cart-item"
       th:each="item : ${cart}">

    <div class="cart-item-image-wrap">
      <img th:src="${item.rose.imagePath}"
           th:alt="${item.rose.variety}"
           class="cart-item-image">
    </div>

    <div class="cart-item-body">

      <div class="cart-item-head">
        <div>
          <h4 th:text="${item.rose.variety}">
            品種名
          </h4>

          <p>
            <span th:text="${item.rose.color}"></span>
            /
            <span th:text="${item.rose.price + '円'}"></span>
          </p>
        </div>
      </div>

      <div class="cart-qty-row">

        <div class="qty-control">
          <span class="qty-value"
                th:text="${item.quantity + '本'}">
          </span>
        </div>

        <strong class="subtotal"
                th:text="${item.subtotal + '円'}">
        </strong>

      </div>

    </div>

  </div>

</div>
        </section>

        <aside class="content-card">
          <div class="section-head single">
            <div>
              <h3>ご注文内容</h3>
              <p>このあと注文情報を入力します</p>
            </div>
          </div>

          <div class="cart-summary-box">
            <div class="cart-row">
              <span>商品点数</span>
              <strong th:text="${#lists.size(cart) + '種類'}">
</strong>
            </div>
            <div class="cart-row">
              <span>商品合計</span>
              <strong th:text="${total + '円'}">
</strong>
            </div>
            <div class="shipping-note-box">
              <p>クール宅急便：一律 1,000円</p>
              <p>※ 10,000円以上のご注文で送料無料</p>
            </div>
            <div class="form-actions column-actions">
              <a href="/order" class="secondary-btn">買い物を続ける</a>
              <a href="/checkout" class="primary-btn">注文を確定する</a>
            </div>
          </div>
        </aside>
      </div>
    </main>
  </div>

  
</body>
</html>
