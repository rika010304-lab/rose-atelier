<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="stylesheet" href="/css/style.css">
    <title>売上分析</title>
</head>
<body>

<div class="app-layout">

<main class="main-content">

<header class="page-header">
    <div>
        <p class="page-label">Analytics</p>
        <h2>売上分析</h2>
    </div>
</header>

<div class="analytics-grid">

    <div class="analytics-card">
        <h3>総注文件数</h3>
        <p th:text="${totalOrders}">0</p>
    </div>

    <div class="analytics-card">
        <h3>総売上</h3>
        <p th:text="${totalSales} + ' 円'">0</p>
    </div>

    <div class="analytics-card">
        <h3>総販売本数</h3>
        <p th:text="${totalQuantity} + ' 本'">0</p>
    </div>

</div>

<h3>人気品種ランキング TOP5</h3>

<table class="analytics-table">
    <tr>
        <th>品種</th>
        <th>販売本数</th>
    </tr>

    <tr th:each="item : ${ranking}">
        <td th:text="${item.key}"></td>
        <td th:text="${item.value} + '本'"></td>
    </tr>
</table>

<h3>注文履歴</h3>

<table class="analytics-table">
    <tr>
        <th>品種</th>
        <th>本数</th>
        <th>金額</th>
    </tr>

    <tr th:each="history : ${histories}">
        <td th:text="${history.variety}"></td>
        <td th:text="${history.quantity}"></td>
        <td th:text="${history.subtotal}"></td>
    </tr>
</table>

</main>
</div>

</body>
</html>
