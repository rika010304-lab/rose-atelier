<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>豕ｨ譁・匳骭ｲ | 繝舌Λ豕ｨ譁・い繝励Μ</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">

<aside class="sidebar">
  <div class="logo-area">
    <p class="logo-sub">Rose Order App</p>
    <h1>繝舌Λ豕ｨ譁・い繝励Μ</h1>
  </div>

  <nav class="side-nav">
    <a href="/admin">蝨ｨ蠎ｫ荳隕ｧ</a>
      <a href="/add-flower">蜩∫ｨｮ逋ｻ骭ｲ</a>
      <a href="/stock">蝨ｨ蠎ｫ逋ｻ骭ｲ</a>
      <a href="/order">豕ｨ譁・匳骭ｲ</a>
      <a href="/waste">蟒・｣・匳骭ｲ</a>
      <a href="/history">豕ｨ譁・ｱ･豁ｴ</a>
      <a href="/analytics" class="active">螢ｲ荳雁・譫・/a>

    <div class="nav-divider"></div>

    <a href="/welcome" class="back-home">
      竊・繧ｦ繧ｧ繝ｫ繧ｫ繝縺ｸ謌ｻ繧・
    </a>
  </nav>
</aside>


    <main class="main-content">
      <header class="page-header cart-header">
        <div>
          <p class="page-label">Order</p>
          <h2>繝舌Λ繧帝∈繧薙〒豕ｨ譁・☆繧・/h2>
        </div>
        <a href="cart" class="cart-link">
          <span>將 繧ｫ繝ｼ繝・/span>
         <span class="cart-count-badge"
      id="headerCartCount"
      th:text="${cartCount != null ? cartCount : 0}">
  0
</span>
        </a>
        
      </header>

      <section class="content-card">
        <div class="section-head single">
          <div>
            <h3>蜩∫ｨｮ繧帝∈縺ｶ</h3>
            <p>蜀咏悄繧定ｦ九↑縺後ｉ螂ｽ縺阪↑繝舌Λ繧偵き繝ｼ繝医↓霑ｽ蜉縺ｧ縺阪∪縺・/p>
          </div>
        </div>

        <div class="catalog-filter" id="filterButtons">
          <button class="chip active" type="button" data-filter="all">縺吶∋縺ｦ</button>
          <button class="chip" type="button" data-filter="繝斐Φ繧ｯ">繝斐Φ繧ｯ</button>
          <button class="chip" type="button" data-filter="繝ｬ繝・ラ">繝ｬ繝・ラ</button>
          <button class="chip" type="button" data-filter="繧､繧ｨ繝ｭ繝ｼ">繧､繧ｨ繝ｭ繝ｼ</button>
          <button class="chip" type="button" data-filter="繝帙Ρ繧､繝・>繝帙Ρ繧､繝・/button>
          <button class="chip" type="button" data-filter="繧ｰ繝ｪ繝ｼ繝ｳ">繧ｰ繝ｪ繝ｼ繝ｳ</button>
          <button class="chip" type="button" data-filter="繧ｪ繝ｬ繝ｳ繧ｸ">繧ｪ繝ｬ繝ｳ繧ｸ</button>
          <button class="chip" type="button" data-filter="縺昴・莉・>縺昴・莉・/button>
        </div>

        <div class="flower-grid">

  <article class="flower-card"
           th:each="rose : ${roses}"
           th:attr="data-color=${rose.color}">

    <div class="flower-image-wrap">
      <img th:src="${rose.imagePath}"
           th:alt="${rose.variety}"
           class="flower-image">

      <div class="feature-tag-group image-feature-tags">
        <span th:if="${rose.longLasting}" class="feature-tag long">譌･謖√■</span>
        <span th:if="${rose.fragrant}" class="feature-tag aroma">鬥吶ｊ</span>
        <span th:if="${rose.quantity == 0}" class="feature-tag soldout">螢ｲ繧雁・繧・/span>
      </div>
    </div>

    <div class="flower-card-body">
      <div class="tag-group">
        <span class="tag">繝舌Λ</span>
        <span class="soft-color-tag" th:text="${rose.color}">濶ｲ</span>
      </div>

      <h3 class="flower-name" th:text="${rose.variety}">蜩∫ｨｮ蜷・/h3>
      <p class="flower-en-name" th:text="${rose.englishName}">English</p>
      <p class="flower-price" th:text="${rose.price + '蜀・/ 1譛ｬ'}">萓｡譬ｼ</p>

      <form action="/cart/add" method="post" class="card-order-row">
        <input type="hidden" name="id" th:value="${rose.id}">

        <select name="quantity"
                class="qty-select"
                th:disabled="${rose.quantity == 0}">
          <option value="1">1譛ｬ</option>
          <option value="2">2譛ｬ</option>
          <option value="3">3譛ｬ</option>
          <option value="5">5譛ｬ</option>
          <option value="10">10譛ｬ</option>
        </select>

        <button type="submit"
                class="primary-btn card-btn"
                th:disabled="${rose.quantity == 0}"
                th:text="${rose.quantity == 0} ? '螢ｲ繧雁・繧・ : '繧ｫ繝ｼ繝医↓霑ｽ蜉'">
          繧ｫ繝ｼ繝医↓霑ｽ蜉
        </button>
      </form>
    </div>
  </article>

</div>
      </section>
    </main>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
